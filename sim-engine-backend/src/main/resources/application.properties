server.port=8082
spring.application.name=sim-engine-backend
app.payload.ingest.max-decompressed-bytes=1200000000
app.cors.allowed-origins=http://localhost:3337,http://127.0.0.1:3337
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [txId=%X{transactionId:-},traceId=%X{traceId:-},corr=%X{correlationId:-}]

