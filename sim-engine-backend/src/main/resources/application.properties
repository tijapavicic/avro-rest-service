server.port=8082
spring.application.name=sim-engine-backend
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer
app.kafka.logging-topic=logging-test-topic
app.kafka.logging-enabled=true
app.payload.ingest.max-decompressed-bytes=1200000000
app.cors.allowed-origins=http://localhost:3337,http://127.0.0.1:3337
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
logging.pattern.level=%5p [traceId=%X{traceId:-},corr=%X{correlationId:-},req=%X{requestId:-}]

