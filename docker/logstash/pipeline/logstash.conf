################################################################################
#  Logstash pipeline – avro-rest-service
#
#  Receives structured JSON logs from Spring Boot services via GELF (UDP 12201),
#  enriches them, and forwards to Elasticsearch.
################################################################################

input {
  gelf {
    port => 12201
    type => "docker"
  }
}

filter {
  # Docker GELF messages arrive with the JSON payload inside "message".
  # The logstash-logback-encoder already produces valid JSON, so parse it.
  json {
    source => "message"
    target => "app"
    skip_on_invalid_json => true
  }

  # Promote key fields to the top level for easier Kibana filtering.
  if [app][service] {
    mutate { add_field => { "service" => "%{[app][service]}" } }
  }
  if [app][level] {
    mutate { add_field => { "log_level" => "%{[app][level]}" } }
  }
  if [app][transactionId] {
    mutate { add_field => { "transactionId" => "%{[app][transactionId]}" } }
  }
  if [app][traceId] {
    mutate { add_field => { "traceId" => "%{[app][traceId]}" } }
  }
  if [app][correlationId] {
    mutate { add_field => { "correlationId" => "%{[app][correlationId]}" } }
  }

  # Use the container name sent by the GELF driver as the source tag.
  if [container_name] {
    mutate { add_field => { "container" => "%{container_name}" } }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "avro-rest-service-%{+YYYY.MM.dd}"
  }
}

